name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Scriptorium.sln

      - name: Build solution
        run: dotnet build Scriptorium.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Scriptorium.sln --configuration Release --no-build --no-restore
